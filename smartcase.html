<!DOCTYPE html>

<head>

    <style>
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .map-container {
    width: 100%;
    height: 400px;
    position: relative;
    border-radius: 0.5rem;
    overflow: hidden;
    background: #f8f9fa; /* Light background color while tiles load */
    min-height: 300px; /* Ensure minimum height even before content loads */
}
.buildings-dropdown {
    width: 100%;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    overflow: visible; /* Changed from hidden to allow dropdown to show */
    position: relative;
    z-index: 1000;
    display: none; /* Hide by default */
}

.buildings-header {
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
    background: #3b82f6;
    color: white;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.buildings-header:hover {
    background: #2563eb;
}

.buildings-content {
    display: none;
    max-height: 300px;
    overflow-y: auto;
    position: absolute; /* Changed from fixed */
    width: 100%; /* Changed from 50% */
    top: 100%; /* Position right below header */
    left: 0;
    background: white;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    border-radius: 0 0 10px 10px;
}

.building-item {
    padding: 12px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
    color: #333;
    cursor: pointer;
    transition: background 0.3s ease;
}

.building-item small {
    display: block;
    color: #666;
    margin-top: 4px;
}

.building-item:hover {
    background: #f0f0f5;
}

.building-item:last-child {
    border-bottom: none;
}

/* Add some space between building name and small text */
.building-item > div:not(:last-child) {
    margin-bottom: 4px;
}
.leaflet-container {
    width: 100% !important;
    height: 100% !important;
    background: #f8f9fa !important;
}
.leaflet-control-attribution{
    visibility: hidden;
}
        .animate-gradient {
            background-size: 200% 200%;
            animation: gradient 3s ease infinite;
        }

        .company-bg {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
        }

        .card-hover {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .logo-text {
            background: linear-gradient(45deg, #60a5fa, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 2s ease-in-out infinite;
        }

        @keyframes shine {
            0%, 100% { filter: brightness(100%); }
            50% { filter: brightness(120%); }
        }

        .section-fade {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>

const dummyContactData = {

// Logout handler
document.getElementById('logoutBtn').addEventListener('click', function() {
    currentUser = null;
    sessionStorage.removeItem('user');
    window.location.reload();
});

// Check for existing session on page load
window.addEventListener('load', function() {
    const savedUser = sessionStorage.getItem('user');
    if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById('userFullName').textContent = currentUser.fullName;
        document.getElementById('userAvatar').textContent = currentUser.fullName.charAt(0);
        document.getElementById('loginStage').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
    }
});
    imagePreview.addEventListener('click', () => imageInput.click());
    imagePreview.addEventListener('dragover', (e) => {
        e.preventDefault();
        imagePreview.classList.add('border-blue-500');
    });
    imagePreview.addEventListener('dragleave', () => {
        imagePreview.classList.remove('border-blue-500');
    });
    imagePreview.addEventListener('drop', (e) => {
        e.preventDefault();
        imagePreview.classList.remove('border-blue-500');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
            handleImageFile(file);
        }
    });

    imageInput.addEventListener('change', (e) => {
        if (e.target.files[0]) {
            handleImageFile(e.target.files[0]);
        }
    });

    function handleImageFile(file) {
        currentImage = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            previewImg.src = e.target.result;
            previewImg.classList.remove('hidden');
            uploadPrompt.classList.add('hidden');
        };
        reader.readAsDataURL(file);
    }

// Initialize map with fallback tile servers
const map = L.map('map').setView([31.7767, 35.2345], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
    // Add fallback servers
    subdomains: ['a', 'b', 'c'],
    // Add error handling
    errorTileUrl: 'https://cdn.jsdelivr.net/gh/leaflet/leaflet@1.9.4/dist/images/marker-icon.png'
}).addTo(map);

// Add a retry mechanism if tiles fail to load
map.on('tileerror', function(e) {
    setTimeout(() => {
        e.tile.src = e.url;
    }, 1000);
});

let currentMarker = null;

// Update the location handler
document.getElementById('getLocation').addEventListener('click', function() {
    const statusDiv = document.getElementById('locationStatus');
    const detailsDiv = document.getElementById('locationDetails');
    statusDiv.classList.remove('hidden');

    function showStatus(message, type = 'info') {
        statusDiv.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-triangle text-red-500' : 'info-circle text-blue-500'} mr-2"></i>${message}`;

// Fetch nearby buildings function
async function fetchNearbyBuildings() {
    try {
        const url = 'https://overpass-api.de/api/interpreter';
        const data = `data=[out:json];
        (
          way["building"](around:100,31.909239,34.809051);
          relation["building"](around:100,31.909239,34.809051);
        );
        out geom;`;

        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'text',
            },
            body: data,
        });

        const buildingsData = await response.json();
        const dropdown = document.getElementById('nearbyBuildings');

        // Clear existing options except the first one
        while (dropdown.options.length > 1) {
            dropdown.remove(1);
        }

        buildingsData.elements.forEach(building => {
            if (building.tags) {
                const name = building.tags.name || '';
                const nameHe = building.tags['name:he'] || '';
                const nameEn = building.tags['name:en'] || building.tags['name:en2'] || '';
                
                // Only add buildings that have at least one name
                if (name || nameHe || nameEn) {
                    const option = document.createElement('option');
                    option.value = JSON.stringify({
                        id: building.id,
                        type: building.type,
                        geometry: building.geometry
                    });
                    
                    // Create display text with available names
                    const displayTexts = [];
                    if (nameHe) displayTexts.push(nameHe);
                    if (nameEn) displayTexts.push(nameEn);
                    if (name && !displayTexts.includes(name)) displayTexts.push(name);
                    
                    option.textContent = displayTexts.join(' | ');
                    dropdown.appendChild(option);
                }
            }
        });
    } catch (error) {
        console.error('Error fetching nearby buildings:', error);
    }
}
// Global variables for dropdown functionality
let selectedBuildingData = null;
let currentBuildingPolygon = null;

// Dropdown click handler
document.querySelector('.buildings-header').addEventListener('click', function(e) {
    e.stopPropagation(); // Prevent event from bubbling up
    const content = document.querySelector('.buildings-content');
    content.style.display = content.style.display === 'none' ? 'block' : 'none';
});

// Close dropdown when clicking outside
document.addEventListener('click', function(event) {
    const dropdown = document.querySelector('.buildings-dropdown');
    const content = document.querySelector('.buildings-content');
    if (!dropdown.contains(event.target)) {
        content.style.display = 'none';
    }
});

function populateBuildingsDropdown(buildings) {
    const buildingsContent = document.getElementById('buildingsContent');
    const buildingsDropdown = document.querySelector('.buildings-dropdown');
    buildingsContent.innerHTML = '';
    
    // Filter buildings that have names
    const namedBuildings = buildings.filter(building => {
        const tags = building.tags || {};
        return tags.name || tags['name:he'] || tags['name:en'] || tags['name:en2'];
    });

    // If no named buildings found, keep dropdown hidden
    if (namedBuildings.length === 0) {
        buildingsDropdown.style.display = 'none';
        return;
    }

    // Show the dropdown if we have buildings
    buildingsDropdown.style.display = 'block';
    
    // Add default option
    const defaultItem = document.createElement('div');
    defaultItem.className = 'building-item';
    defaultItem.innerHTML = 'בחר בניין';
    defaultItem.addEventListener('click', () => {
        document.getElementById('selectedBuildingText').textContent = 'בחר בניין קרוב';
        if (currentBuildingPolygon) {
            map.removeLayer(currentBuildingPolygon);
        }
        selectedBuildingData = null;
        document.querySelector('.buildings-content').style.display = 'none';
    });
    buildingsContent.appendChild(defaultItem);

    // Add building options
    namedBuildings.forEach(building => {
        const name = building.tags.name || '';
        const nameHe = building.tags['name:he'] || '';
        const nameEn = building.tags['name:en'] || building.tags['name:en2'] || '';
        const levels = building.tags['building:levels'];
        
        const buildingDiv = document.createElement('div');
        buildingDiv.className = 'building-item';
        
        const mainName = nameHe || name;
        const secondaryName = nameEn || '';
        
        buildingDiv.innerHTML = `
            <div>${mainName}</div>
            ${secondaryName ? `<small>${secondaryName}</small>` : ''}
            ${levels ? `<small>קומות: ${levels}</small>` : ''}
        `;

        buildingDiv.addEventListener('click', () => {
            selectedBuildingData = {
                id: building.id,
                type: building.type,
                geometry: building.geometry,
                tags: building.tags
            };
            
            document.getElementById('selectedBuildingText').textContent = mainName;
            document.querySelector('.buildings-content').style.display = 'none';
            updateMapWithBuilding(selectedBuildingData);
        });
        
        buildingsContent.appendChild(buildingDiv);
    });
}

function updateMapWithBuilding(buildingData) {
    // Calculate center point
    let lat = 0, lon = 0, count = 0;
    buildingData.geometry.forEach(point => {
        lat += point.lat;
        lon += point.lon;
        count++;
    });
    
    const center = {
        lat: lat / count,
        lon: lon / count
    };

    // Update map view and marker
    if (currentMarker) {
        map.removeLayer(currentMarker);
    }
    if (currentBuildingPolygon) {
        map.removeLayer(currentBuildingPolygon);
    }
    
    map.setView([center.lat, center.lon], 19);
    currentMarker = L.marker([center.lat, center.lon]).addTo(map);
    
    // Draw building polygon
    const polygonPoints = buildingData.geometry.map(point => [point.lat, point.lon]);
    currentBuildingPolygon = L.polygon(polygonPoints, {
        color: '#3b82f6',
        weight: 2,
        fillOpacity: 0.2
    }).addTo(map);

    // Update location details
    const tags = buildingData.tags;
    document.getElementById('locationDetails').innerHTML = `
        <div class="text-sm">
            <strong>בניין:</strong> ${tags['name:he'] || tags.name || ''}
        </div>
        <div class="text-sm">
            <strong>שם באנגלית:</strong> ${tags['name:en'] || tags['name:en2'] || ''}
        </div>
        ${tags['building:levels'] ? `
        <div class="text-sm">
            <strong>קומות:</strong> ${tags['building:levels']}
        </div>
        ` : ''}
    `;

    // Update currentLocation with building center
    currentLocation = {
        lat: center.lat,
        lon: center.lon,
        address: {
            road: tags['addr:street'] || '',
            city: tags['addr:city'] || 'רחובות',
            building: tags['name:he'] || tags.name || ''
        },
        display_name: `${tags['name:he'] || tags.name || ''}, ${tags['addr:street'] || ''}, רחובות`
    };
}

document.getElementById('analyzeButton').addEventListener('click', async function() {
    console.log('Starting analysis...');

    if (!currentImage) {
        console.log('Validation failed: No image');
        alert('נא להעלות תמונה');
        return;
    }
    if (!currentLocation) {
        console.log('Validation failed: No location');
        alert('נא לזהות מיקום');
        return;
    }
    if (!document.getElementById('caseDescription').value.trim()) {
        console.log('Validation failed: No description');
        alert('נא להזין תיאור פנייה');
        return;
    }

    console.log('Initial validations passed');
    console.log('Current Location:', currentLocation);
    console.log('Selected Building Data:', selectedBuildingData);

    this.disabled = true;
    this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> מנתח...';

    try {
        // Convert image to base64
        console.log('Converting image to base64...');
        const imageBase64 = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result.split(',')[1]);
            reader.readAsDataURL(currentImage);
        });
        console.log('Image conversion completed');

        // Create structured data for analysis
        const analysisData = {
            image: {
                data: imageBase64,
                filename: currentImage.name,
                contentType: currentImage.type
            },
            location: {
                coordinates: {
                    lat: Number(currentLocation.lat),
                    lon: Number(currentLocation.lon)
                },
                address: {
                    street: currentLocation.address?.road || '',
                    city: currentLocation.address?.city || currentLocation.address?.town || '',
                    formatted_address: currentLocation.display_name || ''
                }
            },
            description: document.getElementById('caseDescription').value,
            metadata: {
                timestamp: new Date().toISOString(),
                source: 'web-form'
            }
        };

        // Add building data if available
        if (selectedBuildingData) {
            console.log('Adding building data to analysis...');
            analysisData.building = {
                id: selectedBuildingData.id,
                type: selectedBuildingData.type,
                name: selectedBuildingData.tags?.name || '',
                name_he: selectedBuildingData.tags?.['name:he'] || '',
                name_en: selectedBuildingData.tags?.['name:en'] || selectedBuildingData.tags?.['name:en2'] || '',
                levels: selectedBuildingData.tags?.['building:levels']
            };

            // Update coordinates to building center
            let lat = 0, lon = 0, count = 0;
            selectedBuildingData.geometry.forEach(point => {
                lat += point.lat;
                lon += point.lon;
                count++;
            });
            
            analysisData.location.coordinates = {
                lat: lat / count,
                lon: lon / count
            };
            console.log('Building data added successfully');
        }

        console.log('Analysis Data:', analysisData);

        console.log('Sending request to analysis API...');
        const response = await fetch('https://prod-02.northeurope.logic.azure.com:443/workflows/d9dba3d45cfb43bb88ee75d80662afac/triggers/manual/paths/invoke?api-version=2016-06-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=5gmD4CitJbzzdYcOm7TDX-RAvITu6viyFd7uHd1EKuU', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(analysisData)
        });

        if (!response.ok) {
            const errorData = await response.json().catch(() => null);
            console.error('API Response Error:', errorData);
            throw new Error(errorData?.message || 'שגיאה בניתוח הפנייה');
        }

        const responseData = await response.json();
        console.log('API Response:', responseData);
        
        if (!responseData.success) {
            throw new Error('ניתוח הפנייה נכשל');
        }

        console.log('Switching to Stage 2...');
        document.getElementById('stage1').classList.add('hidden');
        const stage2 = document.getElementById('stage2');
        stage2.classList.remove('hidden');

        // Small delay to ensure DOM is updated
        setTimeout(() => {
            console.log('Populating Stage 2 form...');
            const analysis = responseData.analysis;
            
            try {
                // Populate location fields
                document.getElementById('locationType').value = analysis.location.type;
                document.getElementById('buildingName').value = selectedBuildingData ? 
                    (selectedBuildingData.tags['name:he'] || selectedBuildingData.tags.name || '') : '';
                document.getElementById('street').value = analysis.location.address.street || currentLocation.address?.road || '';
                document.getElementById('city').value = analysis.location.address.city || currentLocation.address?.city || '';
                
                // Populate event details
                document.getElementById('category').value = analysis.event.category;
                document.getElementById('urgency').value = analysis.event.urgency;

                // Build description text
                let descriptionText = analysis.event.description;
                if (analysis.event.detected_objects?.length > 0) {
                    descriptionText += '\n\nזוהו בתמונה:\n';
                    descriptionText += analysis.event.detected_objects.map(obj => 
                        `• ${typeof obj === 'string' ? obj : obj.item}`
                    ).join('\n');
                }
                document.getElementById('description').value = descriptionText;

                // Populate department fields
                document.getElementById('department').value = analysis.automatic_fields.department;
                document.getElementById('reporterType').value = analysis.automatic_fields.reporter_type;

                // Update confidence indicator
                console.log('Updating confidence indicator...');
                const firstSection = stage2.querySelector('.bg-gray-50');
                let confidenceContainer = document.getElementById('confidenceIndicator');
                
                if (!confidenceContainer) {
                    confidenceContainer = document.createElement('div');
                    confidenceContainer.id = 'confidenceIndicator';
                    firstSection.appendChild(confidenceContainer);
                }

                if (analysis.confidence_score > 0.8) {
                    confidenceContainer.innerHTML = `
                        <div class="space-y-2">
                            <div class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm inline-flex items-center gap-1">

                                רמת דיוק גבוהה (${Math.round(analysis.confidence_score * 100)}%)

                            ` : ''}
                        </div>
                    `;
                } else {
                    confidenceContainer.innerHTML = '';

                console.log('Stage 2 form population completed successfully');

                console.error('Error while populating form:', error);
                throw error;
            }
